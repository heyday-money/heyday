[package]
name = "heyday-money"
version = "0.0.1-beta.7"
description = "An offline personal finance desktop app"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"

[lib]
name = "heyday_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
heyday-core = { path = "../crates/heyday-core" }
base64 = "0.22"
png = "0.18"
sha2 = "0.10"
zeroize = "1.8"
subtle = "2.6"
getrandom = "0.3"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "=2.5.4"
tempfile = "3"
tokio = { version = "1", features = ["sync", "net", "time", "io-util"] }
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
rust_xlsxwriter = "0.92"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[dev-dependencies]
zip = { version = "7.4", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["macros", "rt"] }
