[package]
name = "heyday-core"
version = "0.1.0"
description = "Shared platform-independent logic for Heyday.Money"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/heyday-money/heyday"

[dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["sync"] }
png = "0.18"
sha2 = "0.10"
base64 = "0.22"
url = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

aes-gcm = { version = "0.10.3", features = ["zeroize"] }
hkdf = "0.12"
hmac = "0.12"
zeroize = "1.8"
subtle = "2.6"
getrandom = "0.3"
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
